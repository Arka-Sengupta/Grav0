<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grav0 — Relativistic Gravity Simulator</title>
  <link rel="shortcut icon" href="public/favicon.ico" type="image/x-icon">
  <meta name="description"
    content="GPU-accelerated relativistic gravity simulator visualizing spacetime curvature and N-body celestial mechanics in real-time." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <!-- 3d canvas -->
  <canvas id="sim-canvas"></canvas>

  <!-- top left HUD -->
  <div id="hud" aria-label="Performance metrics">
    <span id="fps-value" class="hud-value">--</span>
    <span class="hud-label">FPS</span>
    <span class="hud-sep">|</span>
    <span id="body-count" class="hud-value">0</span>
    <span class="hud-label">/ <span id="body-count-max">64</span> bodies</span>
    <span class="hud-sep">|</span>
    <span id="gpu-badge" class="badge">…</span>
    <span class="hud-sep">|</span>
    <span class="hud-label">©<a href="https://www.github.com/Arka-Sengupta" target="_blank" style="color:var(--accent-cyan); text-decoration:none;">Arka Sengupta</a> <span id="current-year"></span></span>
    <script>document.getElementById("current-year").textContent = new Date().getFullYear();</script>
  </div>

  <!-- toggle btn for mobile devices -->
  <button id="btn-toggle-panel" class="panel-toggle" aria-label="Toggle panel">☰</button>

  <!--the panel on side -->
  <aside id="side-panel" role="complementary" aria-label="Simulation controls">

    <!-- Logo -->
    <header class="panel-header">
      <div class="logo">
        <span class="logo-icon">⊙</span>
        <span class="logo-text">Grav<span class="logo-zero">0</span></span>
      </div>
      <p class="logo-sub">Relativistic Gravity Simulation engine</p>
    </header>

    <!-- ── Time cntrls -->
    <div class="panel-scroll">

      <section class="panel-section">
        <h2 class="section-title">Time Control</h2>
        <div class="time-controls">
          <button id="btn-play" class="btn btn-primary active" aria-label="Play/Pause simulation">⏸ Pause</button>
          <button id="btn-reset" class="btn btn-danger" aria-label="Reset simulation">↺ Reset</button>
        </div>
        <label class="slider-label">
          <span>Speed</span>
          <span id="time-label">×1.0</span>
        </label>
        <input type="range" id="time-scale" min="-2" max="3" step="0.01" value="0" aria-label="Simulation time scale"
          class="range-slider" />
        <div class="slider-ticks">
          <span>X0.01</span>
          <span>X1</span>
          <span>X1000</span>
        </div>
      </section>

      <!-- Presets-->
      <section class="panel-section">
        <h2 class="section-title">Presets</h2>
        <div class="preset-grid">
          <button id="preset-sun-earth" class="btn btn-preset" title="star + planets">
            3-bodied star System
          </button>
          <button id="preset-binary" class="btn btn-preset" title="Binary star system">
             Binary Stars
          </button>
          <button id="preset-blackhole" class="btn btn-preset" title="Supermassive black hole + orbiting stars">
             Black Hole
          </button>
        </div>
      </section>

      <!--Active Bodies-->
      <section class="panel-section bodies-section">
        <h2 class="section-title">Active Bodies</h2>
        <div id="body-list" class="body-list" role="list" aria-label="List of active bodies">
          <div class="empty-hint">No bodies — add one below or use a preset</div>
        </div>
      </section>

      <!--Add Body Form -->
      <section class="panel-section">
        <h2 class="section-title">Add Body</h2>
        <form id="add-body-form" novalidate>
          <!-- Mass -->
          <div class="field-group">
            <label class="field-label" for="input-mass">Mass</label>
            <div class="mass-row">
              <input type="number" id="input-mass" class="field-input" value="1" min="0.000001" step="any"
                placeholder="1.0" aria-label="Body mass" required />
              <select id="mass-unit" class="field-select" aria-label="Mass unit">
                <option value="solar">M☉</option>
                <option value="kg">kg</option>
              </select>
            </div>
            <span id="mass-preview" class="mass-preview">1.000 M☉</span>
          </div>

          <!-- Position -->
          <fieldset class="field-fieldset">
            <legend class="field-legend">Position (AU)</legend>
            <div class="xyz-row">
              <div class="xyz-field">
                <label for="input-px">X</label>
                <input type="number" id="input-px" class="field-input xyz-input" value="0" step="any" placeholder="0" />
              </div>
              <div class="xyz-field">
                <label for="input-py">Y</label>
                <input type="number" id="input-py" class="field-input xyz-input" value="0" step="any" placeholder="0" />
              </div>
              <div class="xyz-field">
                <label for="input-pz">Z</label>
                <input type="number" id="input-pz" class="field-input xyz-input" value="0" step="any" placeholder="0" />
              </div>
            </div>
          </fieldset>

          <!-- Velocity -->
          <fieldset class="field-fieldset">
            <legend class="field-legend">Velocity (AU/yr)</legend>
            <!-- Auto Orbit toggle -->
            <button type="button" id="btn-auto-orbit" class="btn btn-auto-orbit active"
              title="Automatically compute circular orbital velocity for the entered position">
              🔄 Auto Orbit: ON
            </button>
            <div class="xyz-row" style="margin-top:8px;">
              <div class="xyz-field">
                <label for="input-vx">vX</label>
                <input type="number" id="input-vx" class="field-input xyz-input" value="0" step="any" placeholder="0" />
              </div>
              <div class="xyz-field">
                <label for="input-vy">vY</label>
                <input type="number" id="input-vy" class="field-input xyz-input" value="0" step="any" placeholder="0" />
              </div>
              <div class="xyz-field">
                <label for="input-vz">vZ</label>
                <input type="number" id="input-vz" class="field-input xyz-input" value="0" step="any" placeholder="0" />
              </div>
            </div>
            <!-- Live orbit preview -->
            <div id="orbit-hint" class="orbit-hint" style="display:none;"></div>
          </fieldset>

          <div id="form-error" class="form-error" role="alert" aria-live="polite"></div>

          <button type="submit" id="btn-add-body" class="btn btn-success btn-full">
            + Add Body
          </button>
        </form>
      </section>


    </div><!--panel-scroll -->

  </aside>


  <!-- Tooltip(body hover info)-->
  <div id="body-tooltip" class="body-tooltip" aria-hidden="true"></div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
